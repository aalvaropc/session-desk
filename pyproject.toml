[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session-desk"
version = "0.3.0"
description = "A local panel to review, trash and restore Claude Code and Codex sessions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "aalvaropc" }]
keywords = ["claude", "claude-code", "codex", "sessions", "transcripts", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
session-desk = "session_desk.cli:main"

[project.urls]
Homepage = "https://github.com/aalvaropc/session-desk"
Issues = "https://github.com/aalvaropc/session-desk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/session_desk"]

[dependency-groups]
dev = ["ruff", "mypy"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
